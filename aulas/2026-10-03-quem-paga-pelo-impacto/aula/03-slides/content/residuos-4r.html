    <h2>Os 4R e a ordem da lei</h2>
    <p>A lei fixa a <strong>ordem de prioridade</strong>:</p>
    <ol class="ordem">
      <li>não geração</li>
      <li>redução</li>
      <li>reutilização</li>
      <li>reciclagem</li>
      <li>tratamento</li>
      <li>disposição final dos rejeitos</li>
    </ol>
    <p class="fonte">BRASIL. Lei nº 12.305/2010, art. 9º.</p>
